name: mira_finance_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # library for hashing password
  bcrypt: ^1.2.0
  # library for protected methods
  meta: ^1.18.0
  # library to handle database connection
  sqflite_sqlcipher: ^3.4.0
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.1
  sqlite3_flutter_libs: ^0.5.42
  # libraries for notification
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  # libraries for secure storage and cryptography
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^10.3.0
  # library for shared preferences
  shared_preferences: ^2.5.5
  # library for icon personalization
  flutter_launcher_icons: ^0.14.4
  # library to gather more information
  # about the current device
  device_info_plus: ^13.1.0
  # library for local authorization
  # from the device (fingerprint, face id, etc.)
  local_auth: ^3.0.2
  # library for listeners management
  provider: ^6.1.5+1
  # library for the charts
  fl_chart: ^1.2.0
  intl: ^0.20.3
  # package for background activities
  workmanager: ^0.10.9
  # package to mock resources during tests
  mocktail: ^1.0.5
  # library for cloud connection
  # with google drive
  googleapis: ^17.0.0
  google_sign_in: ^7.2.0
  i_google_drive: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # define assets to upload in the 
  # application to use
  assets:
    # logos for the application
    - assets/logos/extended_logo.png
    - assets/logos/restricted_logo.png
    - assets/data/credentials.json

# customizing application icon
# settings cross-platform
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/application_logo.png"
  min_sdk_android: 21 # optional
  web:
    generate: true
    image_path: "assets/logos/application_logo.png"
  windows:
    generate: true
    image_path: "assets/logos/application_logo.png"
    icon_size: 48 # pixel
  macos:
    generate: true
    image_path: "assets/logos/application_logo.png"
  linux:
    generate: true
    image_path: "assets/logos/application_logo.png"