name: mira_finance_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # library for hashing password
  bcrypt: ^1.2.0
  # library for protected methods
  meta: ^1.18.0
  # library to handle database connection
  sqflite_sqlcipher: ^3.4.0
  path: ^1.9.1
  # libraries for notification
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  # libraries for secure storage and cryptography
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
