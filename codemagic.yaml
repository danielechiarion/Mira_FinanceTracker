workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      java: 17
    scripts:
      - name: Dipendenze
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release -t lib/main.dart
    artifacts:
      - build/**/outputs/**/*.apk